services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-scoop}
      MARIADB_USER: ${MARIADB_USER:-scoop}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - scoop-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./scoop-api
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-scoop}
      DB_USERNAME: ${MARIADB_USER:-scoop}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      IA_API_KEY: ${IA_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-haiku-latest}
      SERVICE_END_HOUR: ${SERVICE_END_HOUR:-22}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./scoop-web
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  scoop-mariadb:
