spring:
  application:
    name: scoop-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/scoop}
    username: ${DB_USERNAME:scoop}
    password: ${DB_PASSWORD:scoop}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
app:
  google-client-id: ${GOOGLE_CLIENT_ID:}
  operator-emails: ${OPERATOR_EMAILS:}
  ia-api-key: ${IA_API_KEY:}
  claude-model: ${CLAUDE_MODEL:claude-3-5-haiku-latest}
  claude-api-url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  service-end-hour: ${SERVICE_END_HOUR:22}
  demo-login-enabled: ${DEMO_LOGIN_ENABLED:false}
---
spring:
  config:
    activate:
      on-profile: demo
app:
  demo-login-enabled: true
